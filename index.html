<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="拼单算路">
<title>拼单算路 · 双平台接单计算器</title>
<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --card2:#273449; --line:#334155;
    --txt:#e2e8f0; --sub:#94a3b8; --acc:#38bdf8; --good:#34d399;
    --warn:#fbbf24; --bad:#f87171; --btn:#2563eb;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; background:var(--bg); color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    padding:0 0 60px; line-height:1.45;
  }
  .wrap{max-width:560px; margin:0 auto; padding:14px 14px 20px;}
  header{padding:10px 0 6px;}
  header h1{font-size:20px; margin:0; display:flex; align-items:center; gap:8px;}
  header p{color:var(--sub); font-size:13px; margin:4px 0 0;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px;}
  .card h2{font-size:15px; margin:0 0 10px; display:flex; align-items:center; gap:6px;}
  .tag{font-size:11px; color:var(--acc); border:1px solid var(--acc); border-radius:20px; padding:1px 8px; margin-left:auto;}
  label{display:block; font-size:12px; color:var(--sub); margin:10px 0 4px;}
  input[type=text], input[type=number], select{
    width:100%; background:var(--card2); border:1px solid var(--line); color:var(--txt);
    border-radius:10px; padding:11px 12px; font-size:16px; outline:none;
  }
  input:focus, select:focus{border-color:var(--acc);}
  .row{display:flex; gap:10px;}
  .row>div{flex:1;}
  .inline{display:flex; align-items:center; gap:8px; margin-top:8px;}
  .inline input{width:auto;}
  .inline label{margin:0; font-size:13px; color:var(--txt);}
  .btn{
    display:block; width:100%; background:var(--btn); color:#fff; border:none;
    border-radius:12px; padding:15px; font-size:17px; font-weight:600; cursor:pointer;
  }
  .btn:active{opacity:.85;}
  .btn.ghost{background:var(--card2); color:var(--sub); font-weight:500; font-size:13px; padding:9px;}
  .gps{margin-left:auto; flex:0 0 auto; background:var(--card2); border:1px solid var(--line); color:var(--acc); border-radius:9px; padding:8px 10px; font-size:13px; cursor:pointer;}
  .result{display:none;}
  .result.show{display:block;}
  .metric{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px dashed var(--line); font-size:14px;}
  .metric:last-child{border-bottom:none;}
  .metric .v{font-weight:600;}
  .big{font-size:22px; font-weight:700;}
  .good{color:var(--good);} .warn{color:var(--warn);} .bad{color:var(--bad);}
  .verdict{border-radius:12px; padding:14px; font-size:16px; font-weight:700; margin-top:12px; text-align:center;}
  .verdict.good{background:rgba(52,211,153,.12); border:1px solid var(--good); color:var(--good);}
  .verdict.warn{background:rgba(251,191,36,.12); border:1px solid var(--warn); color:var(--warn);}
  .verdict.bad{background:rgba(248,113,113,.12); border:1px solid var(--bad); color:var(--bad);}
  .seq{background:var(--card2); border-radius:10px; padding:10px 12px; font-size:13px; color:var(--sub); margin-top:8px;}
  .toast{
    position:fixed; left:50%; bottom:20px; transform:translateX(-50%);
    background:#0b1220; border:1px solid var(--line); color:var(--txt);
    padding:10px 16px; border-radius:10px; font-size:13px; max-width:88%;
    opacity:0; pointer-events:none; transition:opacity .25s; z-index:99;
  }
  .toast.show{opacity:1;}
  .note{font-size:11px; color:var(--sub); margin-top:8px; line-height:1.5;}
  .hint{font-size:12px; color:var(--sub);}
  .shot-hint{margin-left:6px; font-size:12px; color:var(--sub);}
  .quick{margin-top:10px; border-radius:10px; padding:10px 12px; font-size:15px; font-weight:600;}
  .quick.good{background:rgba(52,211,153,.12); border:1px solid var(--good); color:var(--good);}
  .quick.bad{background:rgba(248,113,113,.12); border:1px solid var(--bad); color:var(--bad);}
  .raw-ocr{margin-top:10px; background:#0b1220; border:1px solid var(--line); border-radius:10px; padding:10px; font-size:11px; color:var(--sub); white-space:pre-wrap; max-height:170px; overflow:auto; line-height:1.5;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🛵 拼单算路</h1>
    <p>双平台接单计算器 · 输入两单，秒判「值不值得一起送」</p>
  </header>

  <!-- 设置 -->
  <div class="card">
    <h2>⚙️ 设置</h2>
    <div class="row">
      <div>
        <label for="veh">交通工具</label>
        <select id="veh">
          <option value="driving" selected>🚗 开车</option>
          <option value="bike">🛵 电动车 / 自行车</option>
          <option value="foot">🚶 步行</option>
        </select>
      </div>
      <div>
        <label for="threshold">每公里目标 ($/km)</label>
        <input type="number" id="threshold" step="0.1" min="0" value="2">
      </div>
    </div>
    <div class="row" style="margin-top:10px;">
      <div>
        <label for="bonusB">新单时段加价 $（DoorDash 每单+$1/$2 这类）</label>
        <input type="number" id="bonusB" step="0.5" min="0" value="0">
      </div>
    </div>
    <div class="note">路线用免费 OSRM 引擎（目前按🚗驾车计算）。电动车/步行先按驾车近似，距离误差通常很小；以后可接高德/Google 做精确骑行模式。</div>
  </div>

  <!-- 手上这单 -->
  <div class="card">
    <h2>📦 手上这单（A）<span class="tag">Uber / 或已有单</span></h2>
    <div class="inline" style="margin:0 0 4px;">
      <input type="checkbox" id="aPicked">
      <label for="aPicked">我已经取到餐了（跳过取餐点）</label>
    </div>
    <label for="addrPA">取餐地址</label>
    <input type="text" id="addrPA" placeholder="如：McDonald's, 185 Elizabeth St, Melbourne">
    <label for="addrDA">送达地址</label>
    <input type="text" id="addrDA" placeholder="如：120 A'Beckett St, Melbourne VIC 3000">
    <div class="row">
      <div>
        <label for="payoutA">这单金额 $（含小费）</label>
        <input type="number" id="payoutA" step="0.1" min="0" placeholder="8.50">
      </div>
      <div>
        <label for="distA">平台显示距离 km（可选）</label>
        <input type="number" id="distA" step="0.1" min="0" placeholder="2.5">
      </div>
    </div>
    <label>📷 上传这单截图（自动识别金额/距离/时长）</label>
    <div class="inline">
      <button class="gps" id="shotBtnA" type="button">📷 选截图识别</button>
      <span class="shot-hint" id="shotStatusA"></span>
    </div>
    <input type="file" id="shotInputA" accept="image/*" style="display:none;">
    <div class="quick" id="quickResultA" style="display:none;"></div>
    <div class="raw-ocr" id="rawOcrA" style="display:none;"></div>
  </div>

  <!-- 新弹出来的单 -->
  <div class="card">
    <h2>🆕 新弹出来的单（B）<span class="tag">DoorDash 新单</span></h2>
    <label for="addrPB">取餐地址</label>
    <input type="text" id="addrPB" placeholder="如：Melbourne Central, Melbourne">
    <label for="addrDB">送达地址</label>
    <input type="text" id="addrDB" placeholder="如：Richmond VIC 3121">
    <div class="row">
      <div>
        <label for="payoutB">这单金额 $（含小费）</label>
        <input type="number" id="payoutB" step="0.1" min="0" placeholder="9.00">
      </div>
      <div>
        <label for="distB">平台显示距离 km（可选）</label>
        <input type="number" id="distB" step="0.1" min="0" placeholder="3.0">
      </div>
    </div>
    <label>📷 上传新单截图（自动识别金额/距离/时长）</label>
    <div class="inline">
      <button class="gps" id="shotBtn" type="button">📷 选截图识别</button>
      <span class="shot-hint" id="shotStatus"></span>
    </div>
    <input type="file" id="shotInput" accept="image/*" style="display:none;">
    <div class="quick" id="quickResult" style="display:none;"></div>
    <div class="raw-ocr" id="rawOcr" style="display:none;"></div>
  </div>

  <!-- 当前位置 -->
  <div class="card">
    <h2>📍 我现在的位置 <span class="tag">影响绕路判断</span></h2>
    <div class="inline">
      <input type="text" id="curLoc" placeholder="留空则默认在取餐点附近">
      <button class="gps" id="gpsBtn">📍 定位</button>
    </div>
    <div class="note">点「定位」用手机 GPS 填当前位置（需要 HTTPS 环境）。不填则默认你现在在 A 的取餐点。</div>
  </div>

  <button class="btn" id="calcBtn">🧮 计算「接不接」</button>
  <button class="btn ghost" id="sampleBtn" style="margin-top:8px;">填入一组示例数据试试</button>

  <!-- 结果 -->
  <div class="card result" id="resultCard">
    <h2>📊 结果</h2>
    <div id="resultBody"></div>
  </div>

  <div class="note" style="text-align:center; margin-top:14px;">
    数据只在你手机本地算，不上传服务器。<br>地理编码用 Photon（OSM），路线用 OSRM 免费演示服务。
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/tesseract.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const toastEl = $('#toast');
let toastTimer;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toastEl.classList.remove('show'), 3200);
}

// —— 持久化设置 ——
const SET = ['veh','threshold','bonusB'];
function saveSettings(){
  SET.forEach(id => localStorage.setItem('cc_'+id, $('#'+id).value));
}
function loadSettings(){
  SET.forEach(id => {
    const v = localStorage.getItem('cc_'+id);
    if (v !== null) $('#'+id).value = v;
  });
}
SET.forEach(id => document.getElementById(id).addEventListener('change', saveSettings));

// —— 定位 ——
let cur = null; // {lon,lat}
function useGPS(){
  if (!navigator.geolocation){ toast('此浏览器不支持定位，请手动输入'); return; }
  toast('定位中…');
  navigator.geolocation.getCurrentPosition(
    pos => {
      cur = { lon: pos.coords.longitude, lat: pos.coords.latitude };
      $('#curLoc').value = '📍 ' + cur.lat.toFixed(5) + ', ' + cur.lon.toFixed(5);
      toast('已定位');
    },
    err => toast('定位失败：' + err.message),
    { enableHighAccuracy: true, timeout: 9000, maximumAge: 30000 }
  );
}
$('#gpsBtn').addEventListener('click', useGPS);

// —— 通用请求（带限流等待与自动重试） ——
const sleep = ms => new Promise(res => setTimeout(res, ms));
async function fetchJson(url){
  let lastErr;
  for (let a = 0; a < 3; a++){
    await sleep(400); // 拉开间隔，避免连续请求触发免费接口限流
    try{
      const r = await fetch(url);
      if (r.status === 429 || r.status >= 500){ lastErr = new Error('服务繁忙(HTTP ' + r.status + ')'); await sleep(800 * (a + 1)); continue; }
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    }catch(e){ lastErr = e; if (a < 2) await sleep(800 * (a + 1)); }
  }
  throw lastErr || new Error('网络请求失败');
}

// —— 地理编码（Photon） ——
async function geocode(q){
  const url = 'https://photon.komoot.io/api/?limit=1&lang=en&q=' + encodeURIComponent(q);
  const j = await fetchJson(url);
  if (!j.features || !j.features.length) throw new Error('找不到地址：' + q);
  const f = j.features[0];
  const [lon, lat] = f.geometry.coordinates;
  return { lon, lat, name: f.properties.name || q };
}

// —— 路线矩阵（OSRM） ——
async function routeMatrix(points){
  const coords = points.map(p => p.lon + ',' + p.lat).join(';');
  const url = 'https://router.project-osrm.org/table/v1/driving/' + coords + '?annotations=distance,duration';
  const j = await fetchJson(url);
  if (j.code !== 'Ok') throw new Error('路线错误 ' + j.code);
  return { d: j.distances, t: j.durations }; // 米 / 秒
}

// —— 序列枚举 ——
function permutations(arr){
  if (arr.length <= 1) return [arr.slice()];
  const out = [];
  for (let i=0;i<arr.length;i++){
    const rest = arr.slice(0,i).concat(arr.slice(i+1));
    for (const p of permutations(rest)) out.push([arr[i], ...p]);
  }
  return out;
}
// 生成满足「先取后送」的合法顺序（不含起点 C）
function validSequences(aPicked){
  const roles = aPicked ? ['DA','PB','DB'] : ['PA','DA','PB','DB'];
  const valid = [];
  for (const p of permutations(roles)){
    if (aPicked){
      if (p.indexOf('PB') < p.indexOf('DB')) valid.push(p);
    } else {
      if (p.indexOf('PA') < p.indexOf('DA') && p.indexOf('PB') < p.indexOf('DB')) valid.push(p);
    }
  }
  return valid;
}
function costOf(seq, idx, d, t){
  let dist = 0, dur = 0, prev = idx.C;
  for (const role of seq){ const n = idx[role]; dist += d[prev][n]; dur += t[prev][n]; prev = n; }
  return { dist, dur };
}

const ROLE_LABEL = { C:'📍 我的位置', PA:'🥡 A取餐', DA:'🏠 A送达', PB:'🥡 B取餐', DB:'🏠 B送达' };
const fmtKm = m => (m/1000).toFixed(1);
const fmtMin = s => Math.round(s/60);
const fmtMoney = n => '$' + (Math.round(n*100)/100).toFixed(2);

// —— 主计算 ——
async function calc(){
  const aPicked = $('#aPicked').checked;
  const payoutA = parseFloat($('#payoutA').value) || 0;
  const payoutB = parseFloat($('#payoutB').value) || 0;
  const bonusB = parseFloat($('#bonusB').value) || 0;
  const distA = parseFloat($('#distA').value) || 0;
  const distB = parseFloat($('#distB').value) || 0;
  const threshold = parseFloat($('#threshold').value) || 2;
  const totalB = payoutB + bonusB;

  if (payoutB <= 0){ toast('请填新单 B 的金额'); return; }

  const btn = $('#calcBtn');
  btn.textContent = '⏳ 计算中…'; btn.disabled = true;
  $('#resultCard').classList.remove('show');

  try{
    // 1. 地理编码各点
    const needAddr = [];
    if (!$('#addrPA').value.trim() && !aPicked) needAddr.push('A取餐地址');
    if (!$('#addrDA').value.trim()) needAddr.push('A送达地址');
    if (!$('#addrPB').value.trim()) needAddr.push('B取餐地址');
    if (!$('#addrDB').value.trim()) needAddr.push('B送达地址');
    if (needAddr.length){ toast('还缺：' + needAddr.join('、')); return; }

    const geos = {};
    if ($('#addrPA').value.trim()) geos.PA = await geocode($('#addrPA').value.trim());
    geos.DA = await geocode($('#addrDA').value.trim());
    geos.PB = await geocode($('#addrPB').value.trim());
    geos.DB = await geocode($('#addrDB').value.trim());

    // 2. 确定当前点 C
    let C;
    const curText = $('#curLoc').value.trim();
    if (cur) C = { lon:cur.lon, lat:cur.lat, name:'我的位置(GPS)' };
    else if (curText && !curText.startsWith('📍')) C = await geocode(curText);
    else if (geos.PA) C = { lon:geos.PA.lon, lat:geos.PA.lat, name:'A取餐点附近(默认)' };
    else C = { lon:geos.DA.lon, lat:geos.DA.lat, name:'A送达点附近(默认,可能低估)' };

    // 3. 组装点数组 + 索引
    const pts = [{ role:'C', ...C }];
    const idx = { C:0 };
    if (!aPicked){ idx.PA = pts.length; pts.push({ role:'PA', ...geos.PA }); }
    idx.DA = pts.length; pts.push({ role:'DA', ...geos.DA });
    idx.PB = pts.length; pts.push({ role:'PB', ...geos.PB });
    idx.DB = pts.length; pts.push({ role:'DB', ...geos.DB });

    // 4. 路线矩阵
    const { d, t } = await routeMatrix(pts);

    // 5. 只送 A（基线）
    const baseSeq = aPicked ? ['DA'] : ['PA','DA'];
    const base = costOf(baseSeq, idx, d, t);

    // 6. 接上 B 的最优顺序
    let best = null, bestSeq = null;
    for (const seq of validSequences(aPicked)){
      const c = costOf(seq, idx, d, t);
      if (!best || c.dist < best.dist){ best = c; bestSeq = seq; }
    }

    // 7. 新单 B 单独跑的距离（用于单跑 $/km）
    const bAlone = { dist: d[idx.C][idx.PB] + d[idx.PB][idx.DB], dur: t[idx.C][idx.PB] + t[idx.PB][idx.DB] };

    // 8. 指标
    const marginKm = Math.max(0, (best.dist - base.dist)/1000);
    const marginDur = Math.max(0, Math.round((best.dur - base.dur)/60));
    const baseKm = base.dist/1000;
    const bestKm = best.dist/1000;
    const total = payoutA + totalB;

    const standKm = distB > 0 ? distB : bAlone.dist/1000;
    const bPerKmStand = totalB / standKm;
    const bPerKmMargin = marginKm > 0.01 ? totalB / marginKm : bPerKmStand;

    // 9. 判定
    let verdict, vclass;
    if (bPerKmMargin >= threshold){
      verdict = '✅ 接！多跑 ' + fmtKm(marginKm*1000) + ' km，每公里仍 ' + fmtMoney(bPerKmMargin) + '/km，达标';
      vclass = 'good';
    } else if (bPerKmStand >= threshold){
      verdict = '⚠️ 单跑划算，但绕路把单价拉到 ' + fmtMoney(bPerKmMargin) + '/km，只有顺路才接';
      vclass = 'warn';
    } else {
      verdict = '❌ 不接，单价 ' + fmtMoney(bPerKmStand) + '/km 低于目标 ' + fmtMoney(threshold) + '/km';
      vclass = 'bad';
    }

    // 10. 渲染
    const seqText = C.name + ' → ' + bestSeq.map(r => ROLE_LABEL[r]).join(' → ');
    $('#resultBody').innerHTML = `
      <div class="metric"><span>🚗 只送手上这单（A）</span><span class="v">${fmtKm(baseKm*1000)} km · ${fmtMin(base.dur)} 分钟</span></div>
      <div class="metric"><span>🚚 接上新单一起送（最优）</span><span class="v">${fmtKm(bestKm*1000)} km · ${fmtMin(best.dur)} 分钟</span></div>
      <div class="metric"><span>➕ 额外多跑</span><span class="v ${marginKm>1?'bad':'good'}">${fmtKm(marginKm*1000)} km · ${marginDur} 分钟</span></div>
      <div class="metric"><span>💰 接上后两单合计</span><span class="v">${fmtMoney(total)}</span></div>
      <div class="metric"><span>📈 新单单价（按平台距离）</span><span class="v">${fmtMoney(bPerKmStand)}/km</span></div>
      <div class="metric"><span>📈 新单单价（按实际多跑）</span><span class="v big">${fmtMoney(bPerKmMargin)}/km</span></div>
      <div class="seq">最佳取送顺序：${seqText}</div>
      <div class="verdict ${vclass}">${verdict}</div>
    `;
    $('#resultCard').classList.add('show');
    $('#resultCard').scrollIntoView({ behavior:'smooth', block:'start' });
  } catch(e){
    toast('出错了：' + e.message);
  } finally{
    btn.textContent = '🧮 计算「接不接」'; btn.disabled = false;
  }
}

$('#calcBtn').addEventListener('click', calc);
$('#sampleBtn').addEventListener('click', () => {
  $('#addrPA').value = "McDonald's, 185 Elizabeth St, Melbourne VIC 3000";
  $('#addrDA').value = "120 A'Beckett St, Melbourne VIC 3000";
  $('#payoutA').value = '8.5'; $('#distA').value = '2.5';
  $('#addrPB').value = 'Melbourne Central Station, Melbourne';
  $('#addrDB').value = 'Richmond VIC 3121';
  $('#payoutB').value = '9'; $('#distB').value = '3';
  toast('示例已填入，点「计算」试试');
});


// —— 截图 OCR 识别（Tesseract.js v7，本地识别，不上传） ——
let ocrRunning = false;
function loadImageFile(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = () => rej(new Error('图片读取失败'));
    img.src = url;
  });
}
function downscale(img, maxW){
  const w = img.naturalWidth || img.width;
  const h = img.naturalHeight || img.height;
  const scale = Math.min(1, maxW / w);
  if (scale >= 0.999) return img;
  const c = document.createElement('canvas');
  c.width = Math.round(w * scale); c.height = Math.round(h * scale);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c;
}
function parseOffer(text){
  let payout = null;
  const amt = text.match(/\$\s*(\d+(?:[.,]\d{1,2})?)/);
  if (amt) payout = parseFloat(amt[1].replace(',', '.'));
  let distKm = null;
  const dm = text.match(/(\d+(?:[.,]\d+)?)\s*(km|kilometre|kilometer|mile|miles|mi)\b/i);
  if (dm){
    let v = parseFloat(dm[1].replace(',', '.'));
    if (/^mi/i.test(dm[2]) || /^mile/i.test(dm[2])) v *= 1.60934;
    distKm = v;
  }
  let minutes = null;
  const tm = text.match(/(\d+)\s*(min|mins|minutes?)\b/i);
  if (tm) minutes = parseInt(tm[1], 10);
  return { payout, distKm, minutes };
}
function guessPickup(text){
  const measure = /^\s*\d+(?:[.,]\d+)?\s*(km|mi|min|mins|minutes?|miles?|kilometres?|kilometers?|items?|item)\b/i;
  const skip = /^(doordash|uber|uber\s*eats|total|guaranteed|estimate|estimated|incl|pay|payout|pay out|delivery|deliver|drop|drop off|dropoff|pickup|pick up|earning|earnings|tip|base|distance|time|duration|accept|decline|order|your|new|offer|requests?|navigate|start|delivering)\b/i;
  const numish = /^[\d\s.,$%+()/-]+$/;
  for (const raw of text.split('\n')){
    const l = raw.trim();
    if (l.length < 3) continue;
    if (/^\s*\$/.test(l)) continue;
    if (measure.test(l)) continue;
    if (skip.test(l)) continue;
    if (numish.test(l)) continue;
    if (!/[A-Za-z]/.test(l)) continue;
    return l;
  }
  return null;
}
function ocrTargets(t){
  return t === 'A'
    ? { payout:'#payoutA', dist:'#distA', pickup:'#addrPA', status:'#shotStatusA', raw:'#rawOcrA', quick:'#quickResultA', bonus:false }
    : { payout:'#payoutB', dist:'#distB', pickup:'#addrPB', status:'#shotStatus', raw:'#rawOcr', quick:'#quickResult', bonus:true };
}
async function runOCR(file, statusSel){
  if (typeof Tesseract === 'undefined'){ throw new Error('OCR 组件未加载（可能没联网）'); }
  const worker = await Tesseract.createWorker('eng', 1, {
    workerPath: 'https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/worker.min.js',
    corePath: 'https://cdn.jsdelivr.net/npm/tesseract.js-core@7.0.0',
    langPath: 'https://cdn.jsdelivr.net/npm/@tesseract.js-data/eng@1.0.0/4.0.0_best_int',
    logger: m => { if (m.status === 'recognizing text') $(statusSel).textContent = '识别中 ' + Math.round(m.progress * 100) + '%'; }
  });
  try{
    const { data } = await worker.recognize(file);
    return (data && data.text) || '';
  } finally {
    await worker.terminate();
  }
}
async function handleShot(file, target){
  if (!file) return;
  if (ocrRunning){ toast('还在识别上一张…'); return; }
  const F = ocrTargets(target);
  ocrRunning = true;
  const st = $(F.status);
  st.textContent = '加载识别引擎…';
  try{
    const img = await loadImageFile(file);
    const src = downscale(img, 1600);
    const text = await Promise.race([
      runOCR(src, F.status),
      new Promise((_, rej) => setTimeout(() => rej(new Error('识别超时，可能没联网')), 120000))
    ]);
    if (!text.trim()){ st.textContent = '没识别到文字，试试更清晰的截图'; return; }
    const r = parseOffer(text);
    const parts = [];
    if (r.payout != null){ $(F.payout).value = r.payout; parts.push('金额 $' + r.payout); }
    if (r.distKm != null){ $(F.dist).value = Math.round(r.distKm * 10) / 10; parts.push('距离 ' + (Math.round(r.distKm * 10) / 10) + ' km'); }
    if (r.minutes != null){ parts.push(r.minutes + ' 分钟'); }
    const pick = guessPickup(text);
    if (pick && !$(F.pickup).value.trim()){ $(F.pickup).value = pick + '（识别，请核对）'; parts.push('取餐 ' + pick); }
    st.textContent = parts.length ? ('识别到 ' + parts.join(' · ')) : '识别完成，请核对下方原文';
    const raw = $(F.raw);
    raw.textContent = text;
    raw.style.display = 'block';
    quickVerdict(r, target);
  } catch(e){
    st.textContent = '识别失败';
    toast('OCR 出错：' + e.message);
  } finally {
    ocrRunning = false;
  }
}
function quickVerdict(r, target){
  const F = ocrTargets(target);
  const qr = $(F.quick);
  if (r.payout == null || !(r.distKm > 0)){ qr.style.display = 'none'; return; }
  const bonus = F.bonus ? (parseFloat($('#bonusB').value) || 0) : 0;
  const th = parseFloat($('#threshold').value) || 2;
  const perKm = (r.payout + bonus) / r.distKm;
  const ok = perKm >= th;
  qr.style.display = 'block';
  qr.className = 'quick ' + (ok ? 'good' : 'bad');
  qr.innerHTML = (ok ? '✅' : '❌') + ' 单价 <b>' + fmtMoney(perKm) + '/km</b>' + (ok ? '（达标，≥ ' + fmtMoney(th) + '）' : '（低于目标 ' + fmtMoney(th) + '/km）');
}
$('#shotBtn').addEventListener('click', () => $('#shotInput').click());
$('#shotInput').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if (f) handleShot(f, 'B');
  e.target.value = '';
});
$('#shotBtnA').addEventListener('click', () => $('#shotInputA').click());
$('#shotInputA').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if (f) handleShot(f, 'A');
  e.target.value = '';
});

loadSettings();
// 静默尝试定位（仅 HTTPS/localhost 有效）
if (navigator.geolocation && (location.protocol === 'https:' || location.hostname === 'localhost')){
  navigator.geolocation.getCurrentPosition(
    pos => { cur = { lon: pos.coords.longitude, lat: pos.coords.latitude }; $('#curLoc').value = '📍 ' + cur.lat.toFixed(5) + ', ' + cur.lon.toFixed(5); },
    ()=>{}, { timeout: 6000, maximumAge: 60000 }
  );
}
</script>
